<title>Ecossistema de rolês locais</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: o diagrama direto na superfície da página, legenda logo acima. Estático, sem animação.
   Atores são pictogramas (Hugeicons, MIT, embutidos como <symbol>) em discos de contorno fino.
   Raio: zonas 28px, etiquetas em pílula. Tudo neutro; a única cor marca o dinheiro (o modelo do serviço).
   Informação e material se distinguem pelo traço: tracejado e pontilhado. */
:root {
  --bg: #f4f6f5;
  --core: #ffffff;
  --ink: #15201d;
  --muted: #5a6762;
  --zone: #e9eeec;
  --pillar: #b4bfbb;
  --info: #3b4844;
  --fin: #b0375b;
  --mat: #7d8a85;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Geist", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --core: #1b2522; --ink: #e4ebe8; --muted: #9ba9a4;
    --zone: #151e1b; --pillar: #3e4b46;
    --info: #c3ceca; --fin: #ec85a3; --mat: #7f8c87;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --core: #1b2522; --ink: #e4ebe8; --muted: #9ba9a4;
  --zone: #151e1b; --pillar: #3e4b46;
  --info: #c3ceca; --fin: #ec85a3; --mat: #7f8c87;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(24px, 5vw, 64px);
}

.map { max-width: 1280px; margin: 0 auto; display: grid; gap: clamp(16px, 2.4vw, 28px); }

.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: center; order: 2; }
.legend li {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 500;
  padding: 7px 15px 7px 13px; border-radius: 999px;
}
.legend li { color: var(--ink); padding-left: 0; }
.legend .l-info svg { color: var(--info); }
.legend .l-fin svg { color: var(--fin); }
.legend .l-mat svg { color: var(--mat); }
.legend svg { width: 30px; height: 10px; flex: none; }

.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.map svg.eco { display: block; width: 100%; height: auto; }
@media (max-width: 760px) { .map svg.eco { min-width: 820px; } }

/* Zonas */
.zone { fill: var(--zone); }
.ztag { font: 500 10.5px var(--font-mono); fill: var(--muted); letter-spacing: .2em; text-transform: uppercase; }
.pillar { stroke: var(--pillar); stroke-width: 2; stroke-linecap: round; }

/* Pictogramas: disco com contorno fino */
.actor .disc { fill: var(--core); stroke: var(--pillar); stroke-width: 1; }
.actor .glyph { color: var(--ink); }
.actor .name { font: 650 17px var(--font-display); fill: var(--ink); text-anchor: middle; letter-spacing: -0.01em; }
.actor .sub { font: 400 13px var(--font-body); fill: var(--muted); text-anchor: middle; }
.actor .name, .actor .sub { paint-order: stroke; stroke: var(--zone); stroke-width: 6px; stroke-linejoin: round; }
.actor.on-bg .name, .actor.on-bg .sub { stroke: var(--bg); }
.actor.hub .disc { fill: var(--ink); stroke: none; }
.actor.hub .glyph { color: var(--core); }
.actor.traveler .disc { stroke: var(--ink); stroke-width: 1.25; }

/* Fluxos */
.edge .ln { fill: none; stroke-width: 1.5; }
.t-info .ln { stroke: var(--info); stroke-dasharray: 6 5; }
.t-fin .ln { stroke: var(--fin); stroke-width: 1.75; }
.t-mat .ln { stroke: var(--mat); stroke-dasharray: 0.1 5.5; stroke-linecap: round; stroke-width: 2.75; }
.mk { stroke: none; }
.mk-info { fill: var(--info); } .mk-fin { fill: var(--fin); } .mk-mat { fill: var(--mat); }

.elabel {
  font: 400 13px var(--font-body);
  fill: var(--muted);
  text-anchor: middle;
  paint-order: stroke; stroke: var(--bg); stroke-width: 8px; stroke-linejoin: round;
}
.elabel.in-zone { stroke: var(--zone); }
</style>
