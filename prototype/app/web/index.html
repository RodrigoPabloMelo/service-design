<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Studio App">

  <!--
    Barras do navegador na cor do app (s0 da Maré, #F2F2F5). No celular o
    Safari pinta a barra de status e a faixa da barra de baixo com o fundo da
    página, e o Chrome do Android pinta a barra dele com a theme-color — em
    branco, pareciam cortar o app. O Flutter troca as duas quando o tema muda
    (setPageColor, em design_browser.dart). A meta tem id próprio e vem antes
    de tudo: a do engine (#flutterweb-theme) é apagada pelo MaterialApp, e com
    duas o navegador usa a primeira.
  -->
  <meta id="mare-theme" name="theme-color" content="#F2F2F5">
  <style>
    html, body { background-color: #F2F2F5; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Na tela de início: barra de status clara, como o app (era preta). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Studio App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Studio App</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Fontes do design system @loomi/ui (Sora display + Manrope sans) para o
    chrome de documentação (/docs). Via <link> e não pacote google_fonts:
    dependência nova exige aprovação (CLAUDE.md, Inviolável #4) e o preview
    do designer é web. Fora do web o Flutter cai no fallback do sistema.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
