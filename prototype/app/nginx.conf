server {
  listen 3000; # porta do fe no _base do Studio (probe GET /)
  root /usr/share/nginx/html;
  index index.html;

  # probe do Deployment fe
  location = /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Cache busting (goldenpath flutter doc 14): sem Service Worker
  # (--pwa-strategy none no build), o browser obedece só estes headers.

  # Bundles JS/WASM/CSS — revalida via ETag; deploy novo muda o hash no nome
  location ~* \.(js|css|wasm)$ {
    expires -1;
    add_header Cache-Control "no-cache";
  }

  # HTML e JSON — nunca cachear (index.html e version.json sempre frescos)
  location ~* \.(html|json)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Assets estáticos — cache longo, Flutter controla via hash no nome
  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback — go_router usa path-based routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
