# Publica o protótipo (Flutter web) no GitHub Pages a cada push na main.
#
# Site: https://rodrigopablomelo.github.io/service-design/
# O Pages serve a branch gh-pages (raiz); este workflow builda e substitui o
# conteúdo dela. Antes de publicar roda analyze e testes: build quebrado não
# sobe (CLAUDE.md, regra 1).
name: Deploy do protótipo

on:
  push:
    branches: [main]
    paths:
      - 'prototype/app/**'
      - '.github/workflows/deploy-prototipo.yml'
  workflow_dispatch:

permissions:
  contents: write

# Dois pushes seguidos: só o último publica.
concurrency:
  group: deploy-prototipo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototype/app
    steps:
      - uses: actions/checkout@v4

      # Mesma versão do Flutter do .fvmrc (a usada localmente).
      - name: Versão do Flutter
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Projeto no Pages mora em /service-design/.
      - name: Build web
        run: flutter build web --release -t lib/main_design.dart --base-href /service-design/

      # 404.html = index: o app usa URL sem # (/service-design/agente), e o
      # Pages devolve o 404 em qualquer caminho, que carrega o app e o router
      # abre a tela certa. .nojekyll: publica os arquivos como estão.
      - name: Ajustes do GitHub Pages
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: prototype/app/build/web
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "chore: deploy do protótipo web (${{ github.sha }})"
